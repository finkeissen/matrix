[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "atomic-problem-pipeline"
version = "19.0.0"
description = "Atomic Problem Identification Pipeline with health checks and observability"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "jsonschema>=4.21",
    "python-dotenv>=1.0",
    "streamlit>=1.43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]
semantic = [
    "sentence-transformers>=2.7",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
